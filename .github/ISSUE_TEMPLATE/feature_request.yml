name: Feature request
description: Suggest a new workflow or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Research use case
      description: Describe the task and why existing functions do not cover it.
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: Proposed interface
      description: Show an example call or expected output if possible.
      render: r
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or related packages.

