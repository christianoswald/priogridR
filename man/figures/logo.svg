<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="1160" viewBox="0 0 1000 1160"
     role="img" aria-labelledby="title desc">
  <title id="title">priogridR package hex sticker</title>
  <desc id="desc">A cream hexagon with a deep teal border, the priogridR name, and an original isometric spatial tile illustration with points and a path.</desc>

  <!-- Transparent outside the sticker. -->
  <path d="M500 30 L965 298 Q990 312 990 343 L990 817 Q990 848 965 862 L500 1130 L35 862 Q10 848 10 817 L10 343 Q10 312 35 298 L500 30 Z" fill="#1F5651"/>
  <path d="M500 76 L949 335 L949 825 L500 1084 L51 825 L51 335 Z" fill="#F5EFE2"/>

  <!-- Package name. -->
  <text x="500" y="355" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="118" font-weight="700" letter-spacing="-6" fill="#171717">priogrid<tspan fill="#9A3E2D">R</tspan></text>

  <!-- Centre the complete grid assembly within the hexagon. -->
  <g transform="translate(90 0)">
  <g stroke="#F5EFE2" stroke-width="8" stroke-linejoin="round">
    <polygon points="335,535 410,492 485,535 410,578" fill="#457A73"/>
    <polygon points="410,578 485,535 560,578 485,621" fill="#2F6862"/>
    <polygon points="485,621 560,578 635,621 560,664" fill="#457A73"/>
    <polygon points="560,664 635,621 710,664 635,707" fill="#2F6862"/>
    <polygon points="260,578 335,535 410,578 335,621" fill="#2F6862"/>
    <polygon points="335,621 410,578 485,621 410,664" fill="#457A73"/>
    <polygon points="410,664 485,621 560,664 485,707" fill="#D6A84B"/>
    <polygon points="485,707 560,664 635,707 560,750" fill="#457A73"/>
    <polygon points="185,621 260,578 335,621 260,664" fill="#457A73"/>
    <polygon points="260,664 335,621 410,664 335,707" fill="#2F6862"/>
    <polygon points="335,707 410,664 485,707 410,750" fill="#457A73"/>
    <polygon points="410,750 485,707 560,750 485,793" fill="#2F6862"/>
    <polygon points="110,664 185,621 260,664 185,707" fill="#2F6862"/>
    <polygon points="185,707 260,664 335,707 260,750" fill="#457A73"/>
    <polygon points="260,750 335,707 410,750 335,793" fill="#2F6862"/>
    <polygon points="335,793 410,750 485,793 410,836" fill="#457A73"/>
  </g>

  <!-- Transformation path across the grid. -->
  <path d="M154 663 C240 605 305 675 374 646 S500 600 568 662 S659 706 712 664" fill="none" stroke="#9A3E2D" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#F5EFE2" stroke="#171717" stroke-width="9">
    <circle cx="185" cy="646" r="18" fill="#F5EFE2" stroke="#171717" stroke-width="9"/>
    <circle cx="374" cy="646" r="18" fill="#F5EFE2" stroke="#171717" stroke-width="9"/>
    <circle cx="555" cy="652" r="18" fill="#F5EFE2" stroke="#171717" stroke-width="9"/>
    <circle cx="688" cy="675" r="18" fill="#F5EFE2" stroke="#171717" stroke-width="9"/>
  </g>

  <!-- Coordinate crosshair on the highlighted cell. -->
  <g stroke="#171717" stroke-width="10" stroke-linecap="round">
    <path d="M464 664 L506 688"/>
    <path d="M485 651 L485 701"/>
  </g>
  <circle cx="485" cy="677" r="10" fill="#171717"/>
  </g>

  <!-- Point, line, and polygon inputs feeding a common grid workflow. -->
  <g transform="translate(235 890)" fill="none" stroke="#171717" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="15" fill="#D6A84B"/>
    <path d="M75 16 C98 -18 126 -18 150 16" stroke="#9A3E2D"/>
    <polygon points="225,20 255,-26 292,17 254,37" fill="#457A73"/>
    <path d="M330 4 L395 4"/>
    <path d="M377 -14 L397 4 L377 22"/>
    <polygon points="449,4 477,-12 505,4 477,20" fill="#D6A84B"/>
  </g>

  <text x="500" y="1060" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" fill="#171717" transform="rotate(-30 500 1060)">christianoswald.github.io/priogridR</text>
</svg>
