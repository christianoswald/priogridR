url: https://christianoswald.github.io/priogridR/

template:
  bootstrap: 5

reference:
  - title: Convert data to PRIO-GRID
    contents:
      - starts_with("pg_from_")
  - title: Grid utilities
    contents:
      - pg_create_indices
      - pg_id_from_coords
      - pg_coords_from_id
      - pg_geometry
      - pg_neighbors
      - pg_neighbor_table
      - pg_weights
      - pg_spatial_lag
      - pg_distance
      - pg_buffer_summary
      - pg_nearest
  - title: Data foundations
    contents:
      - pg_validate_data
      - pg_complete_panel
      - pg_join
  - title: Temporal utilities
    contents:
      - pg_temporal_lag
      - pg_temporal_lead
      - pg_temporal_change
      - pg_rolling_summary
      - pg_time_since
  - title: Visualization and workflow
    contents:
      - pg_plot
      - pg_paths
      - pg_theme
  - title: Results and output
    contents:
      - pg_write_result
      - print.pg_result
      - as.data.frame.pg_result
articles:
  - title: Start here
    navbar: ~
    contents:
      - getting-started
      - grid-foundations
      - grid-utilities
      - spatial-context
      - temporal-utilities
      - results-output-visualization
      - conversion-workflows
  - title: Conversion guides
    desc: Detailed workflows for each supported source-data format.
    contents:
      - pg_from_points
      - pg_from_raster
      - pg_from_vector
      - pg_from_netcdf
      - pg_from_table
